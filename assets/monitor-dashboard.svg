<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Driver fatigue monitor dashboard preview</title>
  <desc id="desc">A dark dashboard showing a camera frame, fatigue indicators, and risk score.</desc>
  <rect width="1200" height="675" fill="#101820"/>
  <rect x="34" y="30" width="1132" height="615" rx="18" fill="#17242d" stroke="#2d414b" stroke-width="2"/>
  <text x="70" y="80" fill="#f3f7f5" font-family="sans-serif" font-size="28" font-weight="700">Driver Fatigue Monitor</text>
  <circle cx="1098" cy="70" r="8" fill="#61d095"/><text x="1118" y="78" fill="#b9cbc5" font-family="sans-serif" font-size="16" text-anchor="end">MONITORING</text>
  <rect x="70" y="112" width="730" height="475" rx="12" fill="#263841"/>
  <path d="M90 500 C235 410 300 425 430 470 S650 530 780 415 L780 570 L90 570Z" fill="#1e2d34"/>
  <circle cx="434" cy="294" r="108" fill="#c98e68" opacity=".95"/>
  <path d="M327 277 Q430 145 541 270 Q518 187 430 177 Q344 190 327 277Z" fill="#26313a"/>
  <ellipse cx="391" cy="294" rx="18" ry="10" fill="#152129"/><ellipse cx="478" cy="294" rx="18" ry="10" fill="#152129"/>
  <path d="M394 360 Q432 382 472 360" fill="none" stroke="#5e3029" stroke-width="8" stroke-linecap="round"/>
  <rect x="315" y="185" width="240" height="230" rx="5" fill="none" stroke="#61d095" stroke-width="4"/>
  <text x="92" y="145" fill="#b9cbc5" font-family="sans-serif" font-size="15">LIVE CAMERA FEED</text>
  <rect x="830" y="112" width="296" height="142" rx="12" fill="#20323a"/>
  <text x="858" y="148" fill="#b9cbc5" font-family="sans-serif" font-size="15">RISK SCORE</text>
  <text x="858" y="215" fill="#61d095" font-family="sans-serif" font-size="58" font-weight="700">18</text><text x="948" y="207" fill="#b9cbc5" font-family="sans-serif" font-size="18">/ 100</text>
  <rect x="830" y="274" width="296" height="313" rx="12" fill="#20323a"/>
  <text x="858" y="312" fill="#b9cbc5" font-family="sans-serif" font-size="15">SIGNALS</text>
  <text x="858" y="365" fill="#f3f7f5" font-family="sans-serif" font-size="18">Eyes</text><text x="1095" y="365" fill="#61d095" font-family="sans-serif" font-size="18" text-anchor="end">Open</text>
  <text x="858" y="420" fill="#f3f7f5" font-family="sans-serif" font-size="18">Mouth</text><text x="1095" y="420" fill="#61d095" font-family="sans-serif" font-size="18" text-anchor="end">Normal</text>
  <text x="858" y="475" fill="#f3f7f5" font-family="sans-serif" font-size="18">Attention</text><text x="1095" y="475" fill="#61d095" font-family="sans-serif" font-size="18" text-anchor="end">Forward</text>
  <line x1="858" y1="338" x2="1095" y2="338" stroke="#38505a"/><line x1="858" y1="393" x2="1095" y2="393" stroke="#38505a"/><line x1="858" y1="448" x2="1095" y2="448" stroke="#38505a"/>
  <text x="858" y="540" fill="#61d095" font-family="sans-serif" font-size="16">No warning active</text>
</svg>
