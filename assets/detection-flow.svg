<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Driver fatigue monitor detection flow</title>
  <desc id="desc">A five-step flow from webcam capture to an audio warning.</desc>
  <rect width="1200" height="360" fill="#f4f7f3"/>
  <text x="600" y="55" text-anchor="middle" fill="#17242d" font-family="sans-serif" font-size="25" font-weight="700">From camera frame to driver alert</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(42 112)"><rect width="190" height="130" rx="12" fill="#17242d"/><text x="95" y="50" fill="#61d095" font-size="17" font-weight="700">01</text><text x="95" y="82" fill="#fff" font-size="18">Capture</text><text x="95" y="108" fill="#b9cbc5" font-size="14">Webcam frame</text></g>
    <g transform="translate(272 112)"><rect width="190" height="130" rx="12" fill="#21404a"/><text x="95" y="50" fill="#f2c14e" font-size="17" font-weight="700">02</text><text x="95" y="82" fill="#fff" font-size="18">Landmarks</text><text x="95" y="108" fill="#d1e0dc" font-size="14">Face geometry</text></g>
    <g transform="translate(502 112)"><rect width="190" height="130" rx="12" fill="#21404a"/><text x="95" y="50" fill="#f2c14e" font-size="17" font-weight="700">03</text><text x="95" y="82" fill="#fff" font-size="18">Signals</text><text x="95" y="108" fill="#d1e0dc" font-size="14">Eyes, mouth, pose</text></g>
    <g transform="translate(732 112)"><rect width="190" height="130" rx="12" fill="#21404a"/><text x="95" y="50" fill="#f2c14e" font-size="17" font-weight="700">04</text><text x="95" y="82" fill="#fff" font-size="18">Risk score</text><text x="95" y="108" fill="#d1e0dc" font-size="14">Combine indicators</text></g>
    <g transform="translate(962 112)"><rect width="190" height="130" rx="12" fill="#d9684b"/><text x="95" y="50" fill="#fff" font-size="17" font-weight="700">05</text><text x="95" y="82" fill="#fff" font-size="18">Alert</text><text x="95" y="108" fill="#fff" font-size="14">Audio warning</text></g>
  </g>
  <g fill="none" stroke="#68827d" stroke-width="3" stroke-linecap="round"><path d="M242 177h24"/><path d="M472 177h24"/><path d="M702 177h24"/><path d="M932 177h24"/></g>
  <g fill="#68827d"><path d="m266 177-9-7v14z"/><path d="m496 177-9-7v14z"/><path d="m726 177-9-7v14z"/><path d="m956 177-9-7v14z"/></g>
  <text x="600" y="305" text-anchor="middle" fill="#49605c" font-family="sans-serif" font-size="15">Signals are evaluated continuously while the application is running.</text>
</svg>
